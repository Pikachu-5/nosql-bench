# Bounded local Cassandra correctness smoke; not a comparative measurement.
adapter = cassandra
database_host = 127.0.0.1
database_port = 9042
scenario = normal
mode = open_loop
offered_rate_ops_sec = 100
seed = 42
workers = 2
warmup_ms = 100
duration_ms = 1000
users = 32
posts = 128
follows = 64
hashtags = 8
celebrity_post_percent = 10
output_dir = runs/verification

weight.timeline_read = 40
weight.user_profile_read = 25
weight.post_like = 15
weight.post_create = 10
weight.hashtag_search = 5
weight.user_follow = 5
