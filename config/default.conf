# BenchForge noop calibration workload. Values are deliberately laptop-sized.
adapter = noop
scenario = normal
mode = closed_loop
offered_rate_ops_sec = 1000
seed = 42
workers = 4
warmup_ms = 250
duration_ms = 1000
users = 10000
posts = 100000
follows = 200000
hashtags = 1000
celebrity_post_percent = 10
output_dir = runs

weight.timeline_read = 40
weight.user_profile_read = 25
weight.post_like = 15
weight.post_create = 10
weight.hashtag_search = 5
weight.user_follow = 5
